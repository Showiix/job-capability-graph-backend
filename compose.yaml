services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: job_graph
      POSTGRES_USER: job_graph
      POSTGRES_PASSWORD: job_graph_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_graph -d job_graph"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/job_graph_dev
    healthcheck:
      test:
        - CMD-SHELL
        - cypher-shell -u neo4j -p job_graph_dev 'RETURN 1' >/dev/null
      interval: 5s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data

  api:
    build: ./backend
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - app_files:/data/files

volumes:
  postgres_data:
  neo4j_data:
  app_files:
